name: Branch Protection

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      
      - name: Run tests with coverage
        run: |
          pytest \
            --cov=wearpark \
            --cov-report=json:coverage.json \
            --junit-xml=junit.xml \
            --strict-markers
      
      - name: Check coverage threshold (80%)
        run: |
          COVERAGE=$(grep -o '"percent_covered": [0-9.]*' coverage.json | grep -o '[0-9.]*')
          echo "Current coverage: ${COVERAGE}%"
          
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 80% threshold"
            echo "PR cannot be merged until coverage reaches 80%"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets 80% threshold"
      
      - name: Check test results
        if: always()
        run: |
          if [ -f junit.xml ]; then
            FAILURES=$(grep -c "failure\|error" junit.xml || echo 0)
            if [ "$FAILURES" -gt 0 ]; then
              echo "Tests failed - PR blocked"
              exit 1
            fi
          fi
          echo "All tests passed"
      
      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('coverage.json', 'utf8'));
            const percent = coverage.totals.percent_covered;
            
            const status = percent >= 80 ? 'Good' : 'Bad';
            const comment = `## CI Status
            
${status} **Coverage:** ${percent.toFixed(2)}% (threshold: 80%)
${percent >= 80 ? 'Good PR can be merged' : 'Bad PR blocked - coverage below 80%'}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
