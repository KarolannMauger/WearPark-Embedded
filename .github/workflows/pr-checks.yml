name: Branch Protection

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-test.txt'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      
      - name: Run tests with coverage
        run: |
          pytest \
            --cov=wearpark \
            --cov-report=json:coverage.json \
            --junit-xml=junit.xml \
            --strict-markers
      
      - name: Check coverage threshold (80%)
        run: |
          COVERAGE=$(grep -o '"percent_covered": [0-9.]*' coverage.json | grep -o '[0-9.]*')
          echo "Current coverage: ${COVERAGE}%"
          
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 80% threshold"
            echo "PR cannot be merged until coverage reaches 80%"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets 80% threshold"
      
      - name: Check test results
        if: always()
        run: |
          if [ ! -f junit.xml ]; then
            echo "No test results found - tests may have failed"
            exit 1
          fi
          
          # Check for test failures in junit.xml
          if grep -q 'failures="[1-9]\|errors="[1-9]' junit.xml; then
            echo "❌ Tests failed - PR blocked"
            exit 1
          fi
          echo "✅ All tests passed"
      
      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const fs = require('fs');
              
              // Check if coverage file exists
              if (!fs.existsSync('coverage.json')) {
                console.log('No coverage.json found');
                return;
              }
              
              const coverage = JSON.parse(fs.readFileSync('coverage.json', 'utf8'));
              const percent = coverage.totals.percent_covered;
              
              const status = percent >= 80 ? '✅' : '❌';
              const mergeStatus = percent >= 80 ? '✅ PR can be merged' : '🚫 PR blocked - coverage below 80%';
              const comment = `## CI Test Results\n\n${status} **Coverage:** ${percent.toFixed(2)}% (threshold: 80%)\n${mergeStatus}`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Failed to post comment:', error.message);
              // Don't fail the workflow if comment fails
            }
